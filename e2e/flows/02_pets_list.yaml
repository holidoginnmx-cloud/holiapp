appId: com.holidoginn.app
tags:
  - smoke
  - pets
name: Pets tab renders the list (or empty state)
---
- runFlow:
    file: 01_auth_signin.yaml

# El tab bar es nativo (UITabBar): no admite testID, así que se tapea por la
# etiqueta, que UIKit expone como accessibility label del UITabBarItem.
- tapOn: "Mis Mascotas"

# La lista ES la pantalla: ya no hay View envolviéndola (el scroll tiene que ser
# la raíz para que iOS 26 encoja el tab bar), así que "pets-screen" solo existe
# mientras carga el esqueleto.
- assertVisible:
    id: "pets-list"

# Either the list is populated or the empty state with the CTA is shown.
- runFlow:
    when:
      visible:
        id: "pets-list"
    commands:
      - assertVisible:
          id: "pets-list"
- runFlow:
    when:
      visible:
        id: "pets-empty-state"
    commands:
      - assertVisible:
          id: "pets-empty-create-button"

# FAB to create a new pet must always be present on this screen.
- assertVisible:
    id: "pets-create-fab"
