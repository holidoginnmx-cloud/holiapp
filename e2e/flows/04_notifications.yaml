appId: com.holidoginn.app
tags:
  - smoke
  - notifications
name: Notifications tab renders (list or empty state)
---
- runFlow:
    file: 01_auth_signin.yaml

# El tab bar es nativo (UITabBar): no admite testID, así que se tapea por la
# etiqueta, que UIKit expone como accessibility label del UITabBarItem.
- tapOn: "Notificaciones"

# La lista ES la pantalla: ya no hay View envolviéndola (el scroll tiene que ser
# la raíz para que iOS 26 encoja el tab bar).
- assertVisible:
    id: "notifications-list"

- runFlow:
    when:
      visible:
        id: "notifications-list"
    commands:
      - assertVisible:
          id: "notifications-list"
- runFlow:
    when:
      visible:
        id: "notifications-empty-state"
    commands:
      - assertVisible:
          id: "notifications-empty-state"
